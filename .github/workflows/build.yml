name: Build NoiseEngine VST3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------------
  # macOS build — produces the MacOS/ bundle (Mach-O)
  # -----------------------------------------------------------------------
  build-mac:
    name: macOS (VST3 + AU)
    runs-on: macos-14

    steps:
      - name: Checkout repo (with JUCE submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -G Xcode

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoiseEngine-macOS-VST3
          path: build/NoiseEngine_artefacts/VST3/
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Windows build — produces the x86_64-win/ bundle (PE DLL)
  # -----------------------------------------------------------------------
  build-windows:
    name: Windows (VST3)
    runs-on: windows-latest

    steps:
      - name: Checkout repo (with JUCE submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G "Ninja" -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --config Release --parallel

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoiseEngine-Windows-VST3
          path: build/NoiseEngine_artefacts/VST3/
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Linux build (VST3 only — no AU on Linux)
  # -----------------------------------------------------------------------
  build-linux:
    name: Linux (VST3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (with JUCE submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libfreetype6-dev \
            libglu1-mesa-dev \
            libwebkit2gtk-4.1-dev \
            libcurl4-openssl-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -G "Unix Makefiles"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoiseEngine-Linux-VST3
          path: build/NoiseEngine_artefacts/VST3/
          if-no-files-found: error
